[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-portfolio-lab"
version = "0.1.0"
description = "Auditable multi-agent portfolio research lab"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
full = ["pydantic>=2.7", "httpx>=0.27", "numpy>=1.26", "pandas>=2.2", "streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
finagent = "finagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

